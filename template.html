<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>{{{title}}}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html, body {
                height: 100%;
                background-color: #f5f0eb;
                font-family: Arial, Helvetica, sans-serif;
                color: #2c2c2c;
            }

            .staticrypt-content {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                padding: 60px 20px;
            }

            .top-photo {
                position: absolute;
                top: 1.5%;
                left: 50%;
                transform: translateX(-50%);
                width: 100px;
                height: auto;
            }

            .back-link {
                position: absolute;
                top: 60px;
                left: 80px;
                font-size: 10px;
                font-weight: 200;
                color: #999;
                text-decoration: none;
                letter-spacing: 0.5px;
                transition: color 0.2s ease;
            }

            .back-link:hover {
                color: #2c2c2c;
            }

            .staticrypt-page {
                width: 100%;
                max-width: 320px;
            }

            .staticrypt-instructions {
                margin-bottom: 24px;
            }

            .staticrypt-title {
                font-size: 10px;
                font-weight: 200;
                letter-spacing: 1.5px;
                text-transform: lowercase;
                color: #2c2c2c;
                margin-bottom: 8px;
            }

            .staticrypt-subtitle {
                font-size: 12px;
                font-weight: 300;
                color: #555;
            }

            .staticrypt-password-container {
                position: relative;
                width: 100%;
                margin-bottom: 20px;
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                width: 100%;
                background: transparent;
                border: none;
                border-bottom: 1px solid #ccc;
                padding: 10px 0;
                font-size: 13px;
                font-weight: 300;
                color: #2c2c2c;
                outline: none;
                transition: border-color 0.2s ease;
            }

            .staticrypt-form input[type="password"]:focus {
                border-bottom: 1px solid #2c2c2c;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                background: transparent;
                border: 1px solid #2c2c2c;
                color: #2c2c2c;
                font-size: 11px;
                font-weight: 300;
                letter-spacing: 1px;
                text-transform: lowercase;
                padding: 10px 20px;
                width: 100%;
                cursor: pointer;
                transition: all 0.2s ease;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover {
                background: #2c2c2c;
                color: #f5f0eb;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: #f5f0eb;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 1.5rem;
                height: 1.5rem;
                border: 2px solid #ccc;
                border-right-color: transparent;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media (max-width: 600px) {
                .back-link {
                    top: 25px;
                    left: 25px;
                }
            }
        </style>
    </head>

    <body class="staticrypt-body">
        <img src="./epic%20images/panda.jpeg" alt="" class="top-photo">
        <a href="index.html" class="back-link"><- back</a>

        <div id="staticrypt_loading" class="staticrypt-spinner-container">
            <div class="staticrypt-spinner"></div>
        </div>

        <div id="staticrypt_content" class="staticrypt-content hidden">
            <div class="staticrypt-page">
                <div class="staticrypt-form">
                    <div class="staticrypt-instructions">
                        <div class="staticrypt-title">epic page</div>
                        <div class="staticrypt-subtitle">{{{instructions}}}</div>
                    </div>

                    <form id="staticrypt-form" action="#" method="post">
                        <div class="staticrypt-password-container">
                            <input
                                id="staticrypt-password"
                                type="password"
                                name="password"
                                placeholder="password"
                                autofocus
                            />
                        </div>

                        <label id="staticrypt-remember-label" class="staticrypt-remember hidden">
                            <input id="staticrypt-remember" type="checkbox" name="remember" />
                            remember me
                        </label>

                        <input type="submit" class="staticrypt-decrypt-button" value="enter" />
                    </form>
                </div>
            </div>
        </div>

        <script>
            // Placeholders required by StatiCrypt CLI v3
            const templateError = "Bad password!";
            const templateToggleAltShow = "Show password";
            const templateToggleAltHide = "Hide password";
            const isRememberEnabled = {{{is_remember_enabled}}};
            const staticryptConfig = {{{staticrypt_config}}};

            const templateConfig = {
                rememberExpirationKey: "staticrypt_expiration",
                rememberPassphraseKey: "staticrypt_passphrase",
                replaceHtmlCallback: null,
                clearLocalStorageCallback: null,
            };

            {{{js_staticrypt}}}

            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

            window.onload = async function () {
                const { isSuccessful } = await staticrypt.handleDecryptOnLoad();

                if (!isSuccessful) {
                    document.getElementById("staticrypt_loading").classList.add("hidden");
                    document.getElementById("staticrypt_content").classList.remove("hidden");
                    document.getElementById("staticrypt-password").focus();

                    if (isRememberEnabled) {
                        const rememberLabel = document.getElementById("staticrypt-remember-label");
                        if (rememberLabel) rememberLabel.classList.remove("hidden");
                    }
                }
            };

            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const password = document.getElementById("staticrypt-password").value;
                const rememberEl = document.getElementById("staticrypt-remember");
                const isRememberChecked = rememberEl ? rememberEl.checked : false;

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

                if (!isSuccessful) {
                    alert(templateError);
                }
            });
        </script>
    </body>
</html>
