<!DOCTYPE html>
<html>
    <head>

        <title>epic page - protected</title>

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

                font-family: Arial, Helvetica, sans-serif;
                color: #2c2c2c;
            }

            .top-photo {
                position: absolute;
                top: 1.5%;
                left: 50%;
                transform: translateX(-50%);
                width: 100px;
                height: auto;
            }

            .back-link {
                position: absolute;
                top: 60px;
                left: 80px;
                font-size: 10px;
                font-weight: 200;
                color: #999;
                text-decoration: none;
                letter-spacing: 0.5px;
                transition: color 0.2s ease;
            }

            .back-link:hover {
                color: #2c2c2c;
            }

            .staticrypt-content {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                padding: 60px 20px;
                background-color: #f5f0eb;
            }

            .staticrypt-page {
                width: 100%;
                max-width: 320px;
            }

            .staticrypt-form {
                text-align: left;
            }

            .staticrypt-instructions {
                margin-bottom: 24px;
            }

            .staticrypt-title {
                font-size: 10px;
                font-weight: 200;
                letter-spacing: 1.5px;
                text-transform: lowercase;
                color: #2c2c2c;
                margin-bottom: 8px;
            }

            .staticrypt-subtitle {
                font-size: 12px;
                font-weight: 300;
                color: #555;
            }

            .staticrypt-password-container {
                position: relative;
                width: 100%;
                margin-bottom: 20px;
            }

            #staticrypt-password {
                width: 100%;
                background: transparent;
                border: none;
                border-bottom: 1px solid #ccc;
                padding: 10px 0;
                font-size: 13px;
                font-weight: 300;
                color: #2c2c2c;
                outline: none;
            }

            #staticrypt-password:focus {
                border-bottom: 1px solid #2c2c2c;
            }

            .staticrypt-decrypt-button {
                background: transparent;
                border: 1px solid #2c2c2c;
                color: #2c2c2c;
                font-size: 11px;
                font-weight: 300;
                letter-spacing: 1px;
                text-transform: lowercase;
                padding: 10px 20px;
                width: 100%;
                cursor: pointer;
                transition: all 0.2s ease;
            }

            .staticrypt-decrypt-button:hover {
                background: #2c2c2c;
                color: #f5f0eb;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: #f5f0eb;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 1.5rem;
                height: 1.5rem;
                border: 2px solid #ccc;
                border-right-color: transparent;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media (max-width: 600px) {
                .back-link {
                    top: 25px;
                    left: 25px;
                }
            }
        </style>
